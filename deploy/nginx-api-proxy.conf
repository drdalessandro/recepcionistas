# =============================================================================
# BioWellness · API Medplum — nginx como reverse proxy a un proceso Node (pm2)
#
# A diferencia del front (estáticos, ver nginx-recepcion.conf), acá nginx NO
# sirve archivos: reenvía cada request al proceso `node index.js` que pm2
# mantiene corriendo en un puerto local (Medplum escucha en 8103 por defecto).
#
# ¿En qué puerto escucha tu proceso? En la EC2:
#   pm2 ls                      → nombre del proceso
#   pm2 describe <nombre>       → cwd/script
#   ss -tlnp | grep node        → puerto real en escucha
#
# pm2, una sola vez (para que sobreviva a reinicios de la máquina):
#   pm2 save && pm2 startup     → seguí la instrucción que imprime
#
# Instalación:
#   sudo cp deploy/nginx-api-proxy.conf /etc/nginx/sites-available/api
#   sudo ln -s /etc/nginx/sites-available/api /etc/nginx/sites-enabled/
#   (ajustar server_name, puerto de proxy_pass y rutas TLS)
#   sudo nginx -t && sudo systemctl reload nginx
#
# Si el proceso se cae, nginx devuelve 502: el que lo revive es pm2, no nginx.
# =============================================================================

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.medplum.com.ar;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.medplum.com.ar;

    # --- TLS (ajustar a las rutas reales) ---
    ssl_certificate     /etc/letsencrypt/live/api.medplum.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.medplum.com.ar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Sin root/try_files: TODO se reenvía al proceso Node.
    location / {
        proxy_pass http://127.0.0.1:8103;        # Medplum server (pm2) — puerto confirmado
        proxy_http_version 1.1;

        # El proceso necesita saber quién y cómo lo llamaron (URLs, logs, auth):
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (Medplum usa websocket-subscriptions):
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Operaciones largas (deploy de bots, seed) y uploads:
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # Sin cache de nginx: las respuestas son dinámicas; el cache lo decide la API.
}
