# =============================================================================
# Biowellness · API Medplum — nginx como reverse proxy a un proceso Node (pm2)
#
# A diferencia del front (estáticos, ver nginx-recepcion.conf), acá nginx NO
# sirve archivos: reenvía cada request al proceso `node index.js` que pm2
# mantiene corriendo en un puerto local (Medplum escucha en 8103 por defecto).
#
# ¿En qué puerto escucha tu proceso? En la EC2:
#   pm2 ls                      → nombre del proceso
#   pm2 describe <nombre>       → cwd/script
#   ss -tlnp | grep node        → puerto real en escucha
#
# pm2, una sola vez (para que sobreviva a reinicios de la máquina):
#   pm2 save && pm2 startup     → seguí la instrucción que imprime
#
# Instalación:
#   sudo cp deploy/nginx-api-proxy.conf /etc/nginx/sites-available/api
#   sudo ln -s /etc/nginx/sites-available/api /etc/nginx/sites-enabled/
#   (ajustar server_name, puerto de proxy_pass y rutas TLS)
#   sudo nginx -t && sudo systemctl reload nginx
#
# Si el proceso se cae, nginx devuelve 502: el que lo revive es pm2, no nginx.
# =============================================================================

# nginx no permite un "$" literal dentro de proxy_pass ($execute se interpretaría
# como variable): se inyecta vía esta variable constante.
geo $simbolo_pesos { default "$"; }

# Rate limit del reset de contraseña (endpoint público que manda emails):
# 5 pedidos por minuto por IP alcanzan de sobra para un humano y cortan
# cualquier script. burst=5 absorbe el doble click sin rechazar.
#
# ⚠️ ESTA línea (`limit_req_zone`) va ACÁ, a nivel http, FUERA de todo `server`:
# solo DECLARA la zona y no limita nada por sí sola. La que limita es
# `limit_req`, y va ÚNICAMENTE dentro de `location = /webhooks/reset-password`.
#
# Si `limit_req` termina en el `server` o en un `location /`, limita TODA la API
# a 5 pedidos por minuto y se cae todo: el portal, la app de recepción y
# `npm run deploy:bots` (que hace decenas de requests seguidos) empiezan a
# recibir 429 con el HTML de nginx. Pasó el 2026-08-21 al aplicar este bloque.
# Para verificar dónde quedó, en la EC2: `sudo grep -rn limit_req /etc/nginx/`
limit_req_zone $binary_remote_addr zone=reset_password:10m rate=5r/m;

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.medplum.com.ar;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.medplum.com.ar;

    # --- TLS (ajustar a las rutas reales) ---
    ssl_certificate     /etc/letsencrypt/live/api.medplum.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.medplum.com.ar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ------------------------------------------------------------------
    # Webhook de MercadoPago — URL pública SIN credenciales.
    #
    # MP rechaza URLs con "usuario:secreto@" (no permite userinfo), así que
    # la autenticación la agrega nginx acá: MP llama a esta URL limpia y
    # nginx reenvía al $execute del bot con el Authorization Basic de la
    # ClientApplication dedicada. El bot igual NO confía en el payload:
    # verifica el pago contra la API de MP con el access token.
    #
    # Para completar los 2 placeholders:
    #   BOT_ID_WEBHOOK_MP  → id de bw-webhook-mercadopago (medplum.config.json)
    #   BASIC_BASE64       → echo -n 'CLIENT_ID:CLIENT_SECRET' | base64 -w0
    # Después: sudo nginx -t && sudo systemctl reload nginx
    #
    # Esta URL va en el secret MP_WEBHOOK_URL (Medplum) y en el panel de MP
    # (Tus integraciones → Webhooks → Modo productivo → evento "Pagos"):
    #   https://api.medplum.com.ar/webhooks/mercadopago
    # ------------------------------------------------------------------
    location = /webhooks/mercadopago {
        proxy_pass http://127.0.0.1:8103/fhir/R4/Bot/BOT_ID_WEBHOOK_MP/${simbolo_pesos}execute$is_args$args;
        proxy_http_version 1.1;

        proxy_set_header Authorization     "Basic BASIC_BASE64";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    # ------------------------------------------------------------------
    # Reset de contraseña del PORTAL — misma receta que los webhooks: URL
    # pública limpia, nginx inyecta el Authorization Basic de la
    # ClientApplication y reenvía al $execute de bw-reset-password.
    #
    # El bot valida reCAPTCHA (secret en Project Secrets), arma el link sobre
    # PORTAL_BASE_URL —NO sobre el appBaseUrl del server, que es de la consola
    # de Admin y no se toca— y manda el email en castellano por SES.
    #
    # Para completar los 2 placeholders:
    #   BOT_ID_RESET_PASSWORD → id de bw-reset-password (medplum.config.json)
    #   BASIC_BASE64          → el mismo de /webhooks/mercadopago
    # Después: sudo nginx -t && sudo systemctl reload nginx
    #
    # La llama la página /resetpassword del portal (app.biowellness.ar):
    #   POST https://api.medplum.com.ar/webhooks/reset-password
    # ------------------------------------------------------------------
    location = /webhooks/reset-password {
        # Las dos líneas de rate limit van ACÁ ADENTRO, nunca en el `server`:
        # afuera limitarían toda la API (ver la nota de `limit_req_zone` arriba).
        limit_req zone=reset_password burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8103/fhir/R4/Bot/BOT_ID_RESET_PASSWORD/${simbolo_pesos}execute$is_args$args;
        proxy_http_version 1.1;

        proxy_set_header Authorization     "Basic BASIC_BASE64";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    # ------------------------------------------------------------------
    # Webhook de Twilio (WhatsApp entrante) — misma receta que MercadoPago:
    # URL limpia hacia afuera, nginx inyecta el Authorization Basic. El bot
    # valida además la firma X-Twilio-Signature (secret TWILIO_WEBHOOK_URL).
    #   BOT_ID_WHATSAPP_ENTRANTE → id de bw-whatsapp-entrante (medplum.config.json)
    #   BASIC_BASE64             → el mismo de /webhooks/mercadopago
    # Esta URL va en Twilio (WhatsApp sender → "When a message comes in") y en
    # el Project Secret TWILIO_WEBHOOK_URL:
    #   https://api.medplum.com.ar/webhooks/twilio-whatsapp
    # ------------------------------------------------------------------
    location = /webhooks/twilio-whatsapp {
        proxy_pass http://127.0.0.1:8103/fhir/R4/Bot/BOT_ID_WHATSAPP_ENTRANTE/${simbolo_pesos}execute$is_args$args;
        proxy_http_version 1.1;

        proxy_set_header Authorization     "Basic BASIC_BASE64";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    # Sin root/try_files: TODO se reenvía al proceso Node.
    location / {
        proxy_pass http://127.0.0.1:8103;        # Medplum server (pm2) — puerto confirmado
        proxy_http_version 1.1;

        # El proceso necesita saber quién y cómo lo llamaron (URLs, logs, auth):
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets (Medplum usa websocket-subscriptions):
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Operaciones largas (deploy de bots, seed) y uploads:
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # Sin cache de nginx: las respuestas son dinámicas; el cache lo decide la API.
}
