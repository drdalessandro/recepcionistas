name: CI

on:
  push:
    branches: [main, staging, 'claude/**']
  pull_request:
    branches: [main, staging]

jobs:
  verify:
    name: Typecheck · Tests · Seed (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # El app de recepción tiene su propio tsconfig: el typecheck de la raíz
      # solo cubre `src` y `tests`, así que sin este paso el CI dejaba pasar
      # errores de tipos del front (se descubrían recién en el deploy).
      - name: Typecheck (app de recepción)
        run: npm run typecheck:app

      - name: Tests
        run: npm run test

      - name: Seed (dry-run)
        run: npm run seed -- --dry-run

      # El build no es redundante con el typecheck: `vite build` es lo único que
      # detecta problemas de EMPAQUETADO. El 2026-08-14 un import arrastró
      # `node:crypto` (firma de Twilio) al bundle del navegador; tsc pasó
      # limpio y el build fue lo que lo frenó.
      - name: Build del app de recepción
        run: npm run build:app
